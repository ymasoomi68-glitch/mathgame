<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آزمون فارسی پنجم | رازی و ساخت بیمارستان</title>
<style>
@import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css');
*{box-sizing:border-box}body{margin:0;padding:12px;background:linear-gradient(140deg,#12345b,#167b91);font-family:Vazir,Tahoma,sans-serif;color:#18334b}.wrap{max-width:920px;margin:18px auto}.card{background:#fff;border:4px solid #ffd16f;border-radius:25px;overflow:hidden;box-shadow:0 16px 40px #001b3666}header{text-align:center;padding:23px;background:linear-gradient(120deg,#e1f6ff,#fff1cc);border-bottom:3px solid #83c7df}h1{font-size:clamp(21px,4vw,31px);margin:0;color:#075985}header p{margin:8px 0 0}.credit{margin-top:14px;padding-top:10px;border-top:1px dashed #83c7df;font-size:14px;color:#36566b;line-height:1.9}.credit .designer{font-weight:bold;color:#9a5b00}.pad{padding:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}input[type=text]{width:100%;padding:12px;margin-top:6px;border:2px solid #b9d9e8;border-radius:10px;font:inherit}input[type=text]::placeholder{color:#aab7c2;opacity:1}button{font:inherit;font-weight:bold;border:0;border-radius:11px;padding:11px 17px;background:#087da5;color:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.start{display:block;margin:20px auto;background:#f5aa2b;color:#38280a}.bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px;background:#eaf6fc;border-radius:12px;font-weight:bold}.qbox{margin:17px 0;padding:17px;border:2px solid #9ed3e8;border-radius:18px;background:#fbfeff}.qtext{font-size:18px;font-weight:bold;color:#075985;margin-bottom:15px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{display:flex;align-items:center;gap:8px;padding:11px;background:#eef8fc;border-radius:10px;cursor:pointer}.opt:has(input:checked){background:#d8f3df;outline:2px solid #45a86a}.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}.muted{background:#6d8290}.finish{background:#278e4b}.hidden{display:none!important}.result{text-align:center;background:#fff2c9;padding:20px;border-radius:16px;margin-top:18px}.score{font-size:38px;color:#b64b0b;font-weight:bold}.review{text-align:right}.review li{margin:9px 0;padding:10px;background:#f4f8fa;border-radius:9px}.correct{color:#16753b}.wrong{color:#b42318}.small{font-size:13px;color:#4c6473}@media(max-width:600px){.fields,.opts{grid-template-columns:1fr}.pad{padding:13px}.qtext{font-size:16px}.nav button{padding:10px}}
</style></head><body><div class="wrap"><div class="card"><header><h1>🌟 آزمون آنلاین فارسی پنجم 🌟</h1><p>درس سوم: رازی و ساخت بیمارستان</p><p>۲۰ سؤال: ۵ درک مطلب، ۶ معنی واژه، ۳ هم‌خانواده، ۳ واژه‌آموزی و ۳ مخالف</p><div class="credit">✏️ طراح: <span class="designer">یوسف معصومی</span></div></header>
<section id="start" class="pad"><p>نام و نام خانوادگی را وارد کن. در پایان، نمره و پاسخ درست هر سؤال نمایش داده می‌شود.</p><div class="fields"><label>نام *<input type="text" id="name" placeholder="مثلاً پارمیس" autocomplete="given-name" required></label><label>نام خانوادگی *<input type="text" id="family" placeholder="مثلاً بی‌نیاز" autocomplete="family-name" required></label></div><button class="start" onclick="begin()">شروع آزمون (۲۰ دقیقه) ✨</button></section>
<section id="exam" class="pad hidden"><div class="bar"><span>⏱ زمان باقی‌مانده: <b id="timer">۲۰:۰۰</b></span><span id="counter"></span></div><div id="question"></div><div class="nav"><button id="prev" class="muted" onclick="move(-1)">قبلی</button><button id="next" onclick="move(1)">بعدی</button><button id="submit" class="finish hidden" onclick="finish()">پایان آزمون</button></div><div id="result" class="hidden"></div></section></div><footer style="text-align:center;color:#e6f5ff;padding:12px;font-size:13px">آزمون آموزشی فارسی پنجم دبستان</footer></div>
<script>
const questions=[{"text": "چرا بزرگان شهر تصمیم گرفتند نظر طبیب بزرگ را بپرسند؟", "options": ["برای خرید دارو", "برای ساختن بازار شهر", "برای انتخاب مکان مناسب بیمارستان", "برای انتخاب حاکم شهر"], "correct": 2}, {"text": "طبیب برای پیدا کردن جای مناسب بیمارستان چه چیزی خواست؟", "options": ["چند کتاب", "چند شاخه گل", "چند ظرف آب", "چند تکه گوشت تازه"], "correct": 3}, {"text": "چرا گوشت‌ها را در چند نقطهٔ شهر آویزان کردند؟", "options": ["برای فروش گوشت‌ها", "برای غذای بیماران", "برای مقایسهٔ هوای نقاط مختلف شهر", "برای آزمایش مزهٔ گوشت"], "correct": 2}, {"text": "سالم ماندن گوشت در یک نقطه نشان‌دهندهٔ چه چیزی بود؟", "options": ["هوای پاکیزه‌تر آن محل", "نزدیکی آن محل به بازار", "گرمای بیشتر آن محل", "شلوغی بیشتر آن محل"], "correct": 0}, {"text": "پیام اصلی درس «رازی و ساخت بیمارستان» چیست؟", "options": ["باید بدون بررسی تصمیم گرفت", "دانایی و دقت به حل مسئله کمک می‌کند", "همیشه باید نظر دیگران را نادیده گرفت", "برای تصمیم‌گیری نیازی به دلیل نیست"], "correct": 1}, {"text": "معنی واژهٔ «کهن» چیست؟", "options": ["تازه", "نزدیک", "روشن", "قدیمی"], "correct": 3}, {"text": "معنی واژهٔ «اندیشه» چیست؟", "options": ["سرعت", "فکر", "صدا", "بیماری"], "correct": 1}, {"text": "معنی واژهٔ «شگفت‌زده» چیست؟", "options": ["متعجب", "آرام", "غمگین", "خسته"], "correct": 0}, {"text": "معنی واژهٔ «فاسد» چیست؟", "options": ["خراب و تباه", "تازه", "پاکیزه", "سالم"], "correct": 0}, {"text": "معنی واژهٔ «بلندآوازه» چیست؟", "options": ["گمنام", "کم‌توان", "کم‌سن", "مشهور و نامدار"], "correct": 3}, {"text": "واژهٔ «طبیب» چه معنایی دارد؟", "options": ["پزشک", "معمار", "کشاورز", "نویسنده"], "correct": 0}, {"text": "کدام واژه با «علم» هم‌خانواده است؟", "options": ["علیم (به معنی دردناک)", "عَلَم", "عالم", "قلم"], "correct": 2}, {"text": "کدام واژه با «دانش» هم‌خانواده است؟", "options": ["دندان", "دود", "دانشمند", "دانه"], "correct": 2}, {"text": "کدام واژه با «فکر» هم‌خانواده است؟", "options": ["فکری", "فروغ", "فاکتور", "فنجان"], "correct": 0}, {"text": "در واژهٔ «کارگر»، پسوند «ـگر» به چه معناست؟", "options": ["جای انجام کار", "ابزار کار", "کسی که کاری انجام می‌دهد", "زمان انجام کار"], "correct": 2}, {"text": "«آموزگار» به چه کسی گفته می‌شود؟", "options": ["کسی که آموزش می‌دهد", "کسی که کتاب می‌خرد", "کسی که بیمارستان می‌سازد", "کسی که بیمار می‌شود"], "correct": 0}, {"text": "پسوند «ـستان» در واژهٔ «بیمارستان» به چه چیزی اشاره می‌کند؟", "options": ["زمان گذشته", "نام یک شخص", "جایگاه یا مکان", "صفت یک فرد"], "correct": 2}, {"text": "مخالف واژهٔ «پاکیزه» کدام است؟", "options": ["تمیز", "روشن", "خوش‌بو", "آلوده"], "correct": 3}, {"text": "مخالف واژهٔ «تازه» کدام است؟", "options": ["سالم", "نو", "کهنه", "جوان"], "correct": 2}, {"text": "مخالف واژهٔ «دانایی» کدام است؟", "options": ["هوشیاری", "نادانی", "آگاهی", "بینایی"], "correct": 1}];let idx=0,left=1200,timer=null,answers=Array(questions.length).fill(null),student='';const letters=['الف','ب','ج','د'];
function begin(){let n=document.getElementById('name').value.trim(),f=document.getElementById('family').value.trim();if(!n||!f){alert('برای شروع آزمون، نام و نام خانوادگی خود را وارد کن.');if(!n)document.getElementById('name').focus();else document.getElementById('family').focus();return}student=(n+' '+f).trim();document.getElementById('start').classList.add('hidden');document.getElementById('exam').classList.remove('hidden');render();timer=setInterval(()=>{left--;document.getElementById('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0)finish()},1000)}
function render(){let q=questions[idx];document.getElementById('counter').textContent=`پرسش ${idx+1} از ${questions.length}`;document.getElementById('question').innerHTML=`<div class="qbox"><div class="qtext">${idx+1}. ${q.text}</div><div class="opts">${q.options.map((o,i)=>`<label class="opt"><input type="radio" name="answer" value="${i}" ${answers[idx]===i?'checked':''}> ${letters[i]}) ${o}</label>`).join('')}</div></div>`;document.querySelectorAll('input[name=answer]').forEach(e=>e.addEventListener('change',x=>answers[idx]=Number(x.target.value)));document.getElementById('prev').disabled=idx===0;document.getElementById('next').classList.toggle('hidden',idx===questions.length-1);document.getElementById('submit').classList.toggle('hidden',idx!==questions.length-1)}
function move(d){idx=Math.max(0,Math.min(questions.length-1,idx+d));render()}
function finish(){
  if(timer){clearInterval(timer);timer=null}
  let score=answers.reduce((s,a,i)=>s+(a===questions[i].correct?1:0),0);
  document.getElementById('question').classList.add('hidden');
  document.querySelector('.nav').classList.add('hidden');
  document.querySelector('.bar').classList.add('hidden');
  let r=document.getElementById('result');
  r.classList.remove('hidden');
  r.innerHTML=`<div class="result"><h2>نتیجه آزمون ${student?'— '+student:''}</h2><div class="score">${score} از ${questions.length}</div><p>درصد پاسخ‌های درست: ${Math.round(score/questions.length*100)}٪</p><p>${score===questions.length?'آفرین! همه پاسخ‌ها درست است.':score>=16?'بسیار خوب! پاسخ‌ها را هم مرور کن.':'خوب تلاش کردی؛ بررسی پاسخ‌ها به یادگیری بیشتر کمک می‌کند.'}</p><button onclick="location.reload()">شرکت دوباره در آزمون</button></div><div class="review"><h3>بررسی پاسخ‌ها</h3><ol>${questions.map((q,i)=>`<li><b>${q.text}</b><br><span class="${answers[i]===q.correct?'correct':'wrong'}">پاسخ شما: ${answers[i]===null?'بدون پاسخ':letters[answers[i]]+' ـ '+q.options[answers[i]]}</span><br><span class="correct">پاسخ درست: ${letters[q.correct]} ـ ${q.options[q.correct]}</span></li>`).join('')}</ol></div>`;

  // 🆕 ارسال امتیاز به اپ اصلی
  try {
    window.parent.postMessage({
      type: 'GAME_FINISHED',
      gameId: 'ch3-farsi',
      score: score,
      total: questions.length
    }, '*');
  } catch (e) {}
}
</script></body></html>
