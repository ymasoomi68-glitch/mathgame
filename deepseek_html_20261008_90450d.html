<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f59e0b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ریاضی‌لند" />

  <title>سفر ریاضی پنجم</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="./icons/icon-192.svg" />

  <!-- فونت وزیرمتن -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
  />

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- هدر -->
  <header id="app-header" class="app-header">
    <button id="back-btn" class="icon-btn hidden" aria-label="بازگشت">←</button>
    <h1 id="app-title" class="app-title">🎓 سفر ریاضی پنجم</h1>
    <div class="header-spacer"></div>
  </header>

  <!-- محتوای اصلی -->
  <main id="app-main" class="app-main"></main>

  <!-- مودال نتیجه -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="modal-content"></div>
  </div>

  <!-- بنر آپدیت -->
  <div id="update-banner" class="update-banner hidden">
    <span>🎉 نسخه‌ی جدید آماده است!</span>
    <div class="update-actions">
      <button id="update-btn" class="btn btn-success">به‌روزرسانی</button>
      <button id="dismiss-update" class="btn btn-text">بعداً</button>
    </div>
  </div>

  <script src="./js/storage.js"></script>
  <script src="./js/games/ch1-g1.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
